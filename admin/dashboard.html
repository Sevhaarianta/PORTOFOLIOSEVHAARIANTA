<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard Admin — Sevha Arianta</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    #d9e6ff,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #e4dcff,
                    transparent 35%
                ),
                #eef1f6;
            color: #111;
        }

        .navbar {
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255,255,255,.7);

            border-bottom:
                1px solid
                rgba(255,255,255,.9);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
        }

        .logo span {
            color: #7398ff;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #userEmail {
            color: #737b8a;
            font-size: 13px;
        }

        #logoutButton {
            border: none;
            padding: 10px 16px;
            border-radius: 12px;

            background: #111;
            color: white;

            cursor: pointer;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 1100px;

            margin: auto;
            padding: 50px 20px;
        }

        .badge {
            display: inline-block;

            padding: 8px 13px;

            border-radius: 30px;

            background:
                rgba(115,152,255,.1);

            color: #6489ec;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }

        h1 {
            font-size: 40px;
            letter-spacing: -2px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #737b8a;
            margin-bottom: 35px;
        }

        .card {
            padding: 30px;

            border-radius: 25px;

            background:
                rgba(255,255,255,.7);

            border:
                1px solid
                rgba(255,255,255,.9);

            box-shadow:
                0 20px 60px
                rgba(70,80,110,.12);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #737b8a;
            font-size: 14px;
            line-height: 1.6;
        }

        .success {
            margin-top: 20px;

            padding: 15px;

            border-radius: 12px;

            background:
                rgba(80,200,120,.1);

            color: #328451;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 18px;
            }

            #userEmail {
                display: none;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>
</head>


<body>

    <header class="navbar">

        <div class="logo">
            SEVHA<span>.</span>
        </div>

        <div class="user-area">

            <span id="userEmail">
                Memuat...
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </header>


    <main class="container">

        <div class="badge">
            ADMIN DASHBOARD
        </div>

        <h1>
            Selamat datang.
        </h1>

        <p class="subtitle">
            Dashboard admin Sevha Arianta.
        </p>


        <div class="card">

            <h2>
                Login berhasil.
            </h2>

            <p>
                Kamu sudah berhasil masuk menggunakan
                akun Firebase.
            </p>

            <div class="success">
                ✓ Authentication Firebase berhasil.
            </div>

        </div>

    </main>


    <script type="module">

        import { auth } from "../firebase-config.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        const userEmail =
            document.getElementById("userEmail");

        const logoutButton =
            document.getElementById("logoutButton");


        // ================================
        // CEK LOGIN
        // ================================

        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href =
                    "../admin.html";

                return;

            }

            userEmail.textContent =
                user.email;

        });


        // ================================
        // LOGOUT
        // ================================

        logoutButton.addEventListener(
            "click",
            async () => {

                try {

                    await signOut(auth);

                    window.location.href =
                        "../admin.html";

                } catch (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                }

            }
        );

    </script>

</body>

</html>
