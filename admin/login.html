<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login Admin — Sevha Portfolio</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                SEVHA<span>.</span>
            </div>


            <div class="login-heading">

                <span class="login-label">
                    ADMIN AREA
                </span>

                <h1>
                    Selamat datang.
                </h1>

                <p>
                    Masuk untuk mengelola
                    portfolio kamu.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email admin"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Masuk ke Dashboard
                </button>

            </form>


            <a
                href="../index.html"
                class="back-link"
            >
                ← Kembali ke portfolio
            </a>

        </div>

    </main>


    <script
        type="module"
        src="login.js"
    ></script>

</body>

</html>
