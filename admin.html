<!DOCTYPE html>
<!-- Admin Login Page -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login — Sevha Arianta</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 20%, #d9e6ff, transparent 35%),
                radial-gradient(circle at 80% 80%, #e4dcff, transparent 35%),
                #eef1f6;
            color: #111;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            padding: 42px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.68);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 70px rgba(80, 90, 120, 0.18);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 45px;
        }

        .logo span {
            color: #7398ff;
        }

        .badge {
            display: inline-block;
            padding: 8px 13px;
            border-radius: 30px;
            background: rgba(115, 152, 255, 0.1);
            color: #6489ec;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: 34px;
            letter-spacing: -1.5px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #737b8a;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border-radius: 14px;
            border: 1px solid #dfe3eb;
            background: rgba(255,255,255,.8);
            outline: none;
            font-size: 14px;
            transition: .2s;
        }

        input:focus {
            border-color: #789cff;
            box-shadow: 0 0 0 4px rgba(120,156,255,.12);
        }

        button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 15px;
            background: linear-gradient(135deg, #779aff, #8e7cf5);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 12px 25px rgba(119,154,255,.25);
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
            transform: none;
        }

        #loginError {
            min-height: 20px;
            margin-top: 15px;
            text-align: center;
            color: #e05252;
            font-size: 13px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #777f8e;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #111;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 30px 24px;
            }

            h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="logo">
                SEVHA<span>.</span>
            </div>

            <div class="badge">
                ADMIN AREA
            </div>

            <h1>Selamat datang.</h1>

            <p class="subtitle">
                Masuk ke dashboard untuk mengelola
                portfolio dan konten website Sevha Arianta.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="admin@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginButton"
                >
                    Masuk ke Dashboard
                </button>

                <div id="loginError"></div>

            </form>

            <a
                href="./index.html"
                class="back"
            >
                ← Kembali ke Portfolio
            </a>

        </div>

    </main>

    <script
        type="module"
        src="./admin/login.js">
    </script>

</body>
</html>
